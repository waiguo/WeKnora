name: Build Windows Desktop Lite

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-desktop-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build Windows desktop app
        shell: bash
        run: |
          export EDITION=lite
          export GOLANG_PROTOBUF_REGISTRATION_CONFLICT=warn
          eval "$(./scripts/get_version.sh env)"
          LDFLAGS="$(./scripts/get_version.sh ldflags) -X 'google.golang.org/protobuf/reflect/protoregistry.conflictPolicy=warn'"
          export CGO_CFLAGS="-Wno-deprecated-declarations"
          bash ./scripts/check-license-bundle.sh
          cd cmd/desktop
          wails build -clean -tags "sqlite_fts5" -platform windows/amd64 -nsis -ldflags="${LDFLAGS}" -o "WeKnora Lite"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: weknora-desktop-windows
          path: cmd/desktop/build/bin/*.exe
          retention-days: 30
